name: inspector

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:-inspector}
      POSTGRES_USER: ${PGUSER:-inspector}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
